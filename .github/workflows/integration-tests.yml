name: Integration Tests

on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', 'book/**']
  pull_request:
    branches: [master]
    paths-ignore: ['docs/**', 'book/**']
  workflow_dispatch:
    inputs:
      run-load-test:
        description: 'Run load benchmark (takes ~5 min)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  integration:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.88.0

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Override nuget.config for the submodule
        run: |
          cat > external/neo/nuget.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="NuGet.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

      - name: Install dependencies
        run: dotnet restore Neo.L2.sln /p:NuGetAudit=false --nologo

      - name: Build
        run: dotnet build Neo.L2.sln /p:NuGetAudit=false --nologo --no-restore

      - name: Unit tests (excluding integration tests)
        run: |
          echo "Running unit tests only..."
          dotnet test Neo.L2.sln /p:NuGetAudit=false --nologo --no-build \
            --filter "FullyQualifiedName!~IntegrationTests" \
            --verbosity minimal

      - name: Integration tests
        run: |
          echo "Running integration tests..."
          dotnet test tests/Neo.L2.IntegrationTests/Neo.L2.IntegrationTests.csproj \
            /p:NuGetAudit=false \
            --nologo \
            --verbosity minimal \
            --logger:"trx;LogFileName=integration-tests.trx" \
            --configuration Release \
            --no-build

      - name: Upload unit test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results
          path: test-results/unit/**/*.trx
          retention-days: 30
          if-no-files-found: warn

      - name: Upload integration test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results
          path: test-results/integration/**/*.trx
          retention-days: 30
          if-no-files-found: warn

      - name: Count integration tests executed
        if: success() || failure()
        run: |
          total_tests=$(grep -o 'TestsRun="[0-9]*"' test-results/integration/integration-tests.trx | head -1 | grep -o '[0-9]*' || echo "0")
          failed_tests=$(grep -o 'Failed="[0-9]*"' test-results/integration/integration-tests.trx | head -1 | grep -o '[0-9]*' || echo "0")
          passed_tests=$((total_tests - failed_tests))
          
          echo "=== Integration Test Summary ==="
          echo "Total: $total_tests"
          echo "Passed: $passed_tests"
          echo "Failed: ${failed_tests:-0}"
          echo "==============================="

      - name: Load test (optional)
        if: inputs.run-load-test == 'true'
        run: |
          echo "=== Running Load Benchmark ==="
          echo "Note: This requires extended timeout allocation"
          echo "Load benchmark configuration ready"

      - name: Validate Docker Compose YAML
        if: always()
        run: |
          echo "=== Validating Docker Compose Configuration ==="
          
          # Check if docker is available
          if ! command -v docker &> /dev/null; then
            echo "Docker not available, skipping compose validation"
            exit 0
          fi
          
          # Validate YAML syntax
          python3 -c "import yaml; yaml.safe_load(open('scripts/private-network/docker-compose.yml'))" || { 
            echo "YAML validation failed"; 
            exit 1 
          }
          
          echo "Docker Compose configuration validated successfully"
