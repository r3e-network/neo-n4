<!--
  Neo N4 Elastic Network - Master Architecture Diagram
  This SVG illustrates the complete system architecture with all major components
  and their relationships. Designed for both technical and non-technical audiences.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <defs>
    <!-- Gradient fills -->
    <linearGradient id="contractGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="l2CoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="proverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="900" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-size="28" font-weight="bold" fill="#333">
    Neo N4 Elastic Network Architecture
  </text>
  <text x="700" y="70" text-anchor="middle" font-size="14" fill="#666">
    A zk-Rollup L2 on Neo Blockchain with Elastic Scaling
  </text>
  
  <!-- L1 Layer (Neo Mainnet) -->
  <g transform="translate(50,100)">
    <rect width="1300" height="150" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2" rx="8"/>
    <text x="650" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#2E7D32">
      L1 Layer: Neo Mainnet
    </text>
    
    <!-- NeoHub Contracts -->
    <g transform="translate(100,50)">
      <rect width="200" height="80" fill="url(#contractGrad)" stroke="#fff" stroke-width="1" rx="4"/>
      <text x="100" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">NeoHubContracts</text>
      <text x="100" y="50" text-anchor="middle" font-size="11" fill="#e8f5e9">• RollupHub</text>
      <text x="100" y="68" text-anchor="middle" font-size="11" fill="#e8f5e9">• SharedBridge</text>
      <text x="100" y="86" text-anchor="middle" font-size="11" fill="#e8f5e9">• ZkVerifier</text>
      <text x="100" y="104" text-anchor="middle" font-size="11" fill="#e8f5e9">• GovernanceController</text>
    </g>
    
    <!-- Native Contracts -->
    <g transform="translate(350,50)">
      <rect width="180" height="80" fill="#fff3e0" stroke="#FF9800" stroke-width="2" rx="4"/>
      <text x="90" y="35" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">NativeContracts</text>
      <text x="90" y="55" text-anchor="middle" font-size="11" fill="#BF360C">(L2-specific)</text>
      <text x="90" y="73" text-anchor="middle" font-size="10" fill="#5D4037">L2BridgeContract</text>
      <text x="90" y="88" text-anchor="middle" font-size="10" fill="#5D4037">L2MessageContract</text>
    </g>
  </g>
  
  <!-- Communication Channel -->
  <g transform="translate(50,260)">
    <line x1="0" y1="0" x2="1300" y2="0" stroke="#ddd" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="650" y="-10" text-anchor="middle" font-size="12" fill="#999">▶ On-chain events & cross-chain messages ◀</text>
  </g>
  
  <!-- Off-chain Services Layer -->
  <g transform="translate(50,280)">
    <rect width="1300" height="220" fill="#e3f2fd" stroke="#2196F3" stroke-width="2" rx="8"/>
    <text x="650" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565C0">
      Off-chain Services (Phase-5 Gateway + Operator Cluster)
    </text>
    
    <!-- Phase-5 Gateway (Aggregator) -->
    <g transform="translate(100,50)">
      <rect width="250" height="120" fill="url(#gatewayGrad)" stroke="#fff" stroke-width="1" rx="4"/>
      <text x="125" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">BinaryTreeAggregator</text>
      <text x="125" y="45" text-anchor="middle" font-size="11" fill="#e8eaf6">Phase-5 Proof Aggregation</text>
      
      <!-- Round Provers -->
      <g transform="translate(20,55)">
        <rect width="210" height="60" fill="#fff" stroke="#fff" stroke-width="1" rx="3"/>
        <text x="105" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#7B1FA2">Three Non-Recursive IRoundProver:</text>
        <text x="105" y="35" text-anchor="middle" font-size="10" fill="#4A148C">① Pass-through (identity)</text>
        <text x="105" y="50" text-anchor="middle" font-size="10" fill="#4A148C">② SP1Compress (future)</text>
        <text x="105" y="65" text-anchor="middle" font-size="10" fill="#4A148C">③ Halo2/Risc0 (optional)</text>
      </g>
    </g>
    
    <!-- Sequencer -->
    <g transform="translate(380,50)">
      <rect width="150" height="80" fill="#fce4ec" stroke="#E91E63" stroke-width="2" rx="4"/>
      <text x="75" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#880E4F">SequencerNode</text>
      <text x="75" y="50" text-anchor="middle" font-size="10" fill="#AD1457">dBFT consensus +</text>
      <text x="75" y="65" text-anchor="middle" font-size="10" fill="#AD1457">committee selection</text>
    </g>
    
    <!-- Batcher -->
    <g transform="translate(560,50)">
      <rect width="150" height="80" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2" rx="4"/>
      <text x="75" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">Batcher</text>
      <text x="75" y="50" text-anchor="middle" font-size="10" fill="#2E7D32">Collects tx → forms</text>
      <text x="75" y="65" text-anchor="middle" font-size="10" fill="#2E7D32">batches (10K+ tx/batch)</text>
    </g>
    
    <!-- DA Writers -->
    <g transform="translate(740,50)">
      <rect width="150" height="80" fill="#fff3e0" stroke="#FF9800" stroke-width="2" rx="4"/>
      <text x="75" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">DA Tiering</text>
      <text x="75" y="50" text-anchor="middle" font-size="10" fill="#BF360C">NeoFsRestDAWriter</text>
      <text x="75" y="65" text-anchor="middle" font-size="10" fill="#BF360C">JsonRpcL1DAWriter</text>
    </g>
  </g>
  
  <!-- Data Flow Arrow -->
  <g transform="translate(50,510)">
    <line x1="0" y1="0" x2="1300" y2="0" stroke="#ddd" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="650" y="-10" text-anchor="middle" font-size="12" fill="#999">▶ Serialized batch data ◀</text>
  </g>
  
  <!-- Proving System Layer -->
  <g transform="translate(50,530)">
    <rect width="1300" height="180" fill="#fef7e0" stroke="#FF9800" stroke-width="2" rx="8"/>
    <text x="650" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#E65100">
      Proving System (SP1 Groth16 BN254)
    </text>
    
    <!-- Stage 1: Attestation -->
    <g transform="translate(100,50)">
      <rect width="140" height="60" fill="#fff8e1" stroke="#FFB300" stroke-width="2" rx="4"/>
      <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#FF6F00">AttestationStage</text>
      <text x="70" y="42" text-anchor="middle" font-size="10" fill="#EF6C00">Multisig proof</text>
    </g>
    
    <!-- Arrow between stages -->
    <line x1="250" y1="80" x2="280" y2="80" stroke="#FFB300" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Stage 2: Optimistic -->
    <g transform="translate(290,50)">
      <rect width="140" height="60" fill="#e3f2fd" stroke="#2196F3" stroke-width="2" rx="4"/>
      <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">OptimisticStage</text>
      <text x="70" y="42" text-anchor="middle" font-size="10" fill="#1565C0">Fraud proof window</text>
    </g>
    
    <!-- Arrow between stages -->
    <line x1="440" y1="80" x2="470" y2="80" stroke="#2196F3" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Stage 3: RiscVZk (Final) -->
    <g transform="translate(480,50)">
      <rect width="160" height="80" fill="url(#proverGrad)" stroke="#fff" stroke-width="1" rx="4"/>
      <text x="80" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">RiscVZkStage</text>
      <text x="80" y="45" text-anchor="middle" font-size="10" fill="#ffe0b2">neo-zkvm-host prover</text>
      <text x="80" y="60" text-anchor="middle" font-size="10" fill="#ffe0b2">SP1 Groth16 proof</text>
    </g>
    
    <!-- Arrow to final stage -->
    <line x1="650" y1="80" x2="680" y2="80" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Production Prover -->
    <g transform="translate(700,50)">
      <rect width="200" height="80" fill="#f3e5f5" stroke="#9C27B0" stroke-width="2" rx="4"/>
      <text x="100" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#7B1FA2">ProductionProverDaemon</text>
      <text x="100" y="50" text-anchor="middle" font-size="10" fill="#6A1B9A">• SP1 ELF/vkey/pinned SHA-256</text>
      <text x="100" y="65" text-anchor="middle" font-size="10" fill="#6A1B9A">• Re-executes state in ZK</text>
    </g>
    
    <!-- Output to L1 -->
    <line x1="910" y1="80" x2="1100" y2="80" stroke="#9C27B0" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- L1 Verifier Input -->
    <g transform="translate(1120,50)">
      <rect width="160" height="80" fill="#c8e6c9" stroke="#4CAF50" stroke-width="2" rx="4"/>
      <text x="80" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">ZkVerifierContract</text>
      <text x="80" y="50" text-anchor="middle" font-size="10" fill="#2E7D32">Verifies SP1 proof</text>
      <text x="80" y="65" text-anchor="middle" font-size="10" fill="#2E7D32">accepts rollup state</text>
    </g>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50,730)">
    <rect width="1300" height="150" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="20" y="25" text-anchor="start" font-size="14" font-weight="bold" fill="#333">Legend:</text>
    
    <circle cx="50" cy="45" r="8" fill="url(#contractGrad)"/>
    <text x="70" y="50" font-size="11" fill="#333">Smart Contract Suite (NeoHub)</text>
    
    <circle cx="200" cy="45" r="8" fill="url(#l2CoreGrad)"/>
    <text x="220" y="50" font-size="11" fill="#333">Off-chain Core Services</text>
    
    <circle cx="350" cy="45" r="8" fill="url(#proverGrad)"/>
    <text x="370" y="50" font-size="11" fill="#333">ZK Proving System</text>
    
    <circle cx="500" cy="45" r="8" fill="url(#gatewayGrad)"/>
    <text x="520" y="50" font-size="11" fill="#333">Proof Aggregation Gateway</text>
    
    <line x1="650" y1="40" x2="680" y2="40" stroke="#ddd" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="700" y="50" font-size="11" fill="#333">Communication Channel (On-chain events)</text>
  </g>
  
  <!-- Footer note -->
  <text x="700" y="890" text-anchor="middle" font-size="11" fill="#999">
    For detailed component specifications, see: docs/architecture-walkthrough.md | docs/zh/specification/02-architecture.md
  </text>
</svg>
